version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: afterprint
      POSTGRES_USER: afterprint
      POSTGRES_PASSWORD: afterprint_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afterprint']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: afterprint
      MINIO_ROOT_PASSWORD: afterprint_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 afterprint afterprint_dev_secret;
        mc mb --ignore-existing local/afterprint-originals;
        mc anonymous set none local/afterprint-originals;
        mc mb --ignore-existing local/afterprint-derived;
        mc anonymous set none local/afterprint-derived;
        echo 'MinIO buckets ready';
      "

  clamav:
    image: clamav/clamav:stable
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD', 'clamdcheck']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  minio_data:
